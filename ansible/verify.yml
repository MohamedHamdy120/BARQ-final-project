---
- name: Verify node runtime
  hosts: k8s
  gather_facts: false
  tasks:
    - name: Check containerd is active
      ansible.builtin.command: systemctl is-active containerd
      register: containerd_state
      changed_when: false

    - name: Check SystemdCgroup is enabled in the live containerd config
      ansible.builtin.shell: containerd config dump | grep -E 'SystemdCgroup\s*=\s*true'
      register: cgroup_check
      changed_when: false

    - name: Check crictl can talk to containerd
      ansible.builtin.command: crictl info
      register: crictl_check
      changed_when: false

    - name: Show node results
      ansible.builtin.debug:
        msg:
          - "containerd: {{ containerd_state.stdout }}"
          - "cgroup: {{ cgroup_check.stdout | trim }}"
          - "crictl: OK"

- name: Verify cluster
  hosts: control_plane
  gather_facts: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Wait for all nodes to be Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=120s
      changed_when: false

    - name: Get nodes
      ansible.builtin.command: kubectl get nodes -o wide
      register: nodes
      changed_when: false

    - name: Get system pods
      ansible.builtin.command: kubectl get pods -A
      register: pods
      changed_when: false

    - name: Show cluster state
      ansible.builtin.debug:
        msg:
          - "{{ nodes.stdout_lines }}"
          - "{{ pods.stdout_lines }}"
