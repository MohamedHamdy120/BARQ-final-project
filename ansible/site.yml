- name: Prepare all Kubernetes nodes
  hosts: k8s
  roles:
    - common
- name: Initialise the control plane
  hosts: control_plane
  roles:
    - control_plane

- name: Join the worker nodes
  hosts: workers
  roles:
    - worker

- name: Install cluster add-ons
  hosts: control_plane
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  roles:
    - addons
