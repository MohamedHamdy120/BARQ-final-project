- name: Check whether Argo CD is already installed
  ansible.builtin.command: kubectl -n {{ argocd_namespace }} get deployment argocd-server
  register: argocd_check
  changed_when: false
  failed_when: false

- name: Create the Argo CD namespace
  ansible.builtin.shell: >
    kubectl create namespace {{ argocd_namespace }}
    --dry-run=client -o yaml | kubectl apply -f -
  register: argocd_ns
  changed_when: "'created' in argocd_ns.stdout"

- name: Install Argo CD {{ argocd_version }}
  ansible.builtin.command: >
    kubectl apply -n {{ argocd_namespace }} --server-side --force-conflicts
    -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
  when: argocd_check.rc != 0

- name: Wait until the Argo CD deployments are rolled out
  ansible.builtin.command: kubectl -n {{ argocd_namespace }} rollout status deployment/{{ item }} --timeout=300s
  loop:
    - argocd-server
    - argocd-repo-server
    - argocd-redis
    - argocd-applicationset-controller
  changed_when: false

- name: Wait until the Argo CD application controller is rolled out
  ansible.builtin.command: kubectl -n {{ argocd_namespace }} rollout status statefulset/argocd-application-controller --timeout=300s
  changed_when: false

- name: Load the encrypted application secrets
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/vars/secrets.yml"
  no_log: true
  when: argocd_create_app | bool

- name: Create the application namespace
  ansible.builtin.shell: >
    kubectl create namespace {{ argocd_app_namespace }}
    --dry-run=client -o yaml | kubectl apply -f -
  register: app_ns
  changed_when: "'created' in app_ns.stdout"
  when: argocd_create_app | bool

- name: Read the current flask-db Secret value
  ansible.builtin.command: >
    kubectl -n {{ argocd_app_namespace }} get secret flask-db
    -o jsonpath={.data.DATABASE_URL}
  register: current_db_url
  changed_when: false
  failed_when: false
  no_log: true
  when: argocd_create_app | bool

- name: Create or update the flask-db Secret
  ansible.builtin.shell: >
    kubectl -n {{ argocd_app_namespace }} create secret generic flask-db
    --from-literal=DATABASE_URL="$DB_URL"
    --dry-run=client -o yaml | kubectl apply -f -
  environment:
    DB_URL: "{{ flask_database_url }}"
  no_log: true
  when:
    - argocd_create_app | bool
    - (current_db_url.stdout | default('') | b64decode) != flask_database_url

- name: Read the current flask-redis Secret value
  ansible.builtin.command: >
    kubectl -n {{ argocd_app_namespace }} get secret flask-redis
    -o jsonpath={.data.REDIS_URL}
  register: current_redis_url
  changed_when: false
  failed_when: false
  no_log: true
  when: argocd_create_app | bool

- name: Create or update the flask-redis Secret
  ansible.builtin.shell: >
    kubectl -n {{ argocd_app_namespace }} create secret generic flask-redis
    --from-literal=REDIS_URL="$REDIS_URL"
    --dry-run=client -o yaml | kubectl apply -f -
  environment:
    REDIS_URL: "{{ flask_redis_url }}"
  no_log: true
  when:
    - argocd_create_app | bool
    - (current_redis_url.stdout | default('') | b64decode) != flask_redis_url

- name: Render the Argo CD Application manifest
  ansible.builtin.template:
    src: application.yaml.j2
    dest: /root/argocd-application.yaml
    mode: "0644"
  when: argocd_create_app | bool

- name: Apply the Argo CD Application
  ansible.builtin.command: kubectl apply -f /root/argocd-application.yaml
  register: argocd_app_apply
  changed_when: "'created' in argocd_app_apply.stdout or 'configured' in argocd_app_apply.stdout"
  when: argocd_create_app | bool
