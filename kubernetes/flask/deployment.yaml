
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask
  namespace: barq
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask
          image: ghcr.io/mohamedhamdy120/barq-flask@sha256:9e6ae8f6aac7c0f46c0e6b31111f79f257b66af03e30ddede13596f5824a7ef1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: flask-config

          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flask-db
                  key: DATABASE_URL

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
